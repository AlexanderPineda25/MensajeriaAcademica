# =========================================================
# Server.properties — red, limites y directorio de subidas (FASE 1)
# Se importa desde application.properties (spring.config.import).
# Tambien puede sobre-escribirse con un archivo externo:
#   SPRING_CONFIG_ADDITIONAL_LOCATION=file:/ruta/server.properties
# =========================================================

# Puerto TCP del servidor (requisito: configurable, no hardcodeado)
red.puerto=5000

# Pool ACOTADO de hilos por conexion (§4.3): sustituye al newCachedThreadPool()
# ilimitado. core = hilos permanentes, max = tope duro, queue = espera.
# espera-segundos = espera maxima de una conexion entrante por un trabajador
# libre antes de rechazarla con "servidor lleno" (RF-S46, segunda opcion).
red.pool.core=10
red.pool.max=100
red.pool.queue=100
red.pool.espera-segundos=5
# FASE 11.2: tope por sesion (token bucket, rafaga inicial 2x); 0 = sin limite.
red.pool.tramas-por-segundo=10

# FASE 11.2: TLS opcional con doble puerto (el plano sigue para peers sin TLS).
# Generar el almacen: keytool -genkeypair -alias mensajeria -keyalg RSA -keysize 2048
#   -storetype PKCS12 -keystore config/keystore.p12 -validity 825 -storepass CAMBIAR
#   -keypass CAMBIAR -dname "CN=servidor-mensajeria"
# Politica de secretos: la clave NUNCA queda en claro en este archivo en
# produccion. Fije la variable de entorno RED_TLS_CLAVE con la clave real del
# almacen (o un server.properties externo via SPRING_CONFIG_ADDITIONAL_LOCATION).
# Si TLS esta habilitado y la clave sigue siendo la de ejemplo, el arranque
# falla con mensaje claro en lugar de probar 'CAMBIAR' contra el almacen.
red.tls.habilitado=false
red.tls.puerto=5001
red.tls.almacen=config/keystore.p12
red.tls.clave=${RED_TLS_CLAVE:CAMBIAR}

# Archivos fragmentados (tope propio 50 MB, PROTOCOLO.md §3/§5): techo de
# configuracion para transferencias ARCHIVO_INICIO/PARTE/FIN. El limite
# operativo vive en configuracion_limites (migrado a 50 MB en V2); el
# efectivo es el menor de ambos.
archivo.max-mb=50

# Restriccion de usuarios conectados por archivo de configuracion (req. #2)
# 0 = sin limite. max-conexiones = sesiones totales; por-usuario = sesiones del mismo codigo.
# Prefijo red.limites.* para enlazar con RedProperties.Limites (antes no enlazaba).
red.limites.max-conexiones=100
red.limites.max-conexiones-por-usuario=3

# Directorio relativo a la carpeta del servidor: server/uploads en el monorepo,
# o uploads junto al JAR distribuido. Tambien admite rutas absolutas externas.
red.upload-dir=uploads

# FASE 4: inactividad maxima por sesion en segundos; superada, el servidor
# avisa CLOSE_NOTICE ("cierre por inactividad") y cierra el socket.
# 600 s = 10 minutos (prueba P3 / PLAN Fase 10.1 / RF-S08).
red.sesion.timeout-segundos=600

# Alta de usuarios SOLO por archivo plano (usuarios_iniciales.csv).
# La via REGISTRO por red esta eliminada: el servidor responde
# ERROR "tipo no soportado: REGISTRO".

# Tuberias (PLAN2 §3.3-§3.4): hilos entre-mensajes + parametros visuales.
# PERF-02 (2026-10-05): 4 -> 16 medido con la misma carga de CargaMixtaTest
# (100 sesiones, 400 tramas texto+imagen). Aislado, filtros.hilos=16 sube el
# p95 del ACK de ~1550 ms a ~1190 ms; junto a Hikari 30 el total queda en
# 96-98 tramas/s con p95 ~1100 ms. Son hilos entre mensajes, no por conexion:
# el pool de conexiones (red.pool.max=100) no se toca.
filtros.hilos=16
filtros.giro-grados=180
filtros.brillo-factor=1.25
filtros.reduccion-factor=0.5
