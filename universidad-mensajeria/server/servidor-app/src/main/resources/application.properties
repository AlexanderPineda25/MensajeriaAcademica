# =========================================================
# App
# =========================================================
app.name=Mensajeria-Servidor
# arranque unico (usado por la verificacion multi-motor): sale tras migrar+sembrar
app.once=false
# FASE 1: inicia el servidor TCP al arrancar el contexto (IniciadorServidor)
app.inicio=true
# FASE 1: arranca VistaConsola (bloqueante sobre stdin). false en pruebas/CI
app.consola=true

# Red, limites y uploadDir viven en server.properties (separado a proposito)
spring.config.import=optional:classpath:/server.properties

# =========================================================
# Motor activo: mysql | postgres | oracle   (ADAPTER §5.4)
# Politica de secretos: las claves NUNCA quedan en claro en este archivo en
# produccion. Cada pass admite variable de entorno (DB_MYSQL_PASS,
# DB_POSTGRES_PASS, DB_ORACLE_PASS); el valor tras ':' es solo el defecto local.
# Tambien puede usarse un application.properties externo junto al JAR.
# =========================================================
db.active=mysql

db.mysql.vendor=mysql
db.mysql.url=jdbc:mysql://localhost:3307/mensajeria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
db.mysql.user=root
db.mysql.pass=${DB_MYSQL_PASS:12345}

db.postgres.vendor=postgres
db.postgres.url=jdbc:postgresql://localhost:5432/mensajeria_db
db.postgres.user=postgres
db.postgres.pass=${DB_POSTGRES_PASS:12345}

db.oracle.vendor=oracle
db.oracle.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.oracle.user=MENSAJERIA_DB
db.oracle.pass=${DB_ORACLE_PASS:12345}

flyway.enabled=true
flyway.mysql.locations=classpath:db/migration/mysql
flyway.postgres.locations=classpath:db/migration/postgres
flyway.oracle.locations=classpath:db/migration/oracle

# =========================================================
# Pool (Hikari) — pool.enabled=false usa DriverManager simple
# =========================================================
pool.enabled=true
# PERF-02 (2026-10-05): 10 -> 30 medido, no supuesto. Con 100 sesiones x 4 tramas
# (texto + imagen) contra MySQL real: 79-80 tramas/s con 10, 96-98 con 30 (+23%).
# Bajar a 4 ddropa a 59 tr/s, o sea 10 si era un techo real y no un default.
# MySQL 8.4 tolera 151 conexiones por defecto: 30 esta muy por debajo.
pool.maximumPoolSize=30
pool.minimumIdle=5
pool.idleTimeoutMs=30000
pool.connectionTimeoutMs=30000

# =========================================================
# JPA — el esquema SOLO lo define Flyway
# =========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================================================
# Semilla de usuarios (archivo plano inicial)
# =========================================================
app.seed=classpath:usuarios_iniciales.csv

# =========================================================
# Logs
# =========================================================
# En pruebas desde servidor-app, ../logs queda en server/logs.
# El arranque normal fija una ruta absoluta junto a los datos del servidor.
logging.file.name=../logs/server.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.universidad.mensajeria=INFO
