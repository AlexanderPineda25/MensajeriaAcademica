# Fixture canonico de client.properties (MUERTE-5).
#
# Lo leen los tests de los TRES clientes (Java, Python, .NET) para demostrar que
# el mismo fichero produce los mismos valores en los tres. Si un analizador se
# aparta del formato, su test falla; asi la deriva no puede colarse.
#
# NO es la configuracion de produccion: es una bateria de casos limite, y vive
# fuera de cualquier modulo para que no viaje en la distribucion.
# Formato (PROTOCOLO.md 5.2): clave=valor, '#' comenta, vacias se ignoran.

# comentario al principio del fichero
host = 10.0.0.25
puerto = 5012

# espacios alrededor del '=' y valor con ':' y '=' dentro
db.url = jdbc:h2:mem:prueba;OPTIONS=x=y

# clave repetida: gana la ultima (los 3 deben coincidir)
tema = claro
tema = oscuro

# linea vacia y linea solo con espacios: se ignoran


tls.habilitado = true
tls.puerto = 5443
tls.confianza = C:/confianza/prueba.jks
idioma = es