# client.properties (host · puerto · db.url · idioma · tema · tls — §5.2)
host=localhost
puerto=5000
db.url=sqlite:///~/mensajeria_cliente.db
idioma=es
tema=oscuro
# SEG-01: TLS opcional (mismo framing; apagado por defecto como en Java/.NET).
# tls.confianza = bundle PEM con la CA del servidor; vacio = CAs del sistema.
tls.habilitado=false
tls.puerto=5001
tls.confianza=
