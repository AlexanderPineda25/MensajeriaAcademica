# Cliente PySide6 de Mensajería Académica (Pista 2).
#
# Existe para que `uv run` funcione: el MCP pyside6-mcp lanza la app con
# `uv run python -m pyside6_mcp main.py`, y `uv run` exige pyproject.toml.
# Las dependencias son las mismas que requirements.txt (incluido pillow,
# pendiente de decisión en PROD-05: quitar o usar).
[project]
name = "mensajeria-cliente-python"
version = "1.0.0"
description = "Cliente PySide6 de mensajería académica (TCP + JSON)"
requires-python = ">=3.11"
dependencies = [
    "pillow==10.4.0",
    "PySide6==6.11.2",
    "PySide6-Fluent-Widgets==1.11.3",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
