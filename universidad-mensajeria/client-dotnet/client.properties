host=localhost
puerto=5000
tls.habilitado=false
tls.puerto=5001
# Almacen de confianza de TLS (SEG-01). VA VACIO A PROPOSITO: vacio = el cliente valida
# la cadena con las CA que ya tiene el sistema, que es lo correcto por defecto.
# Si se rellena, es la ruta a un fichero PEM con la CA de confianza del servidor
# (puede contener varias, separadas por el marcador "-----END CERTIFICATE-----").
# Debe existir: si TLS esta habilitado y el fichero no esta, el cliente NO arranca.
# El almacen real nunca se versiona; esta clave es solo la ruta.
tls.confianza=
db.url=sqlite:///~/mensajeria_cliente.db
db.user=
db.pass=
idioma=es
tema=oscuro
